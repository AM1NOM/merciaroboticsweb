<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/logom.png">
    <title>Mercia Robotics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">

    <style>
       
    </style>
</head>
<body>
    <!-- Epic Background -->
    <div class="neural-background"></div>
    
    <!-- Floating Geometric Shapes -->
    <div class="geometric-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <!-- Lines -->
    <div class="neural-lines">
        <div class="neural-line"></div>
        <div class="neural-line"></div>
        <div class="neural-line"></div>
    </div>

    <!-- Header -->
    <header class="glass">
        <nav>
            <a href="#home" class="logo">
                <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mercia Robotics logo">
                    <defs>
                        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#e0a3ff"/>
                            <stop offset="50%" stop-color="#ff69b4"/>
                            <stop offset="100%" stop-color="#9370db"/>
                        </linearGradient>
                    </defs>

                    <!-- use <image> to embed a raster logo inside the svg -->
                    <image href="images/logos.png" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" />
                </svg>

                <span class="logo-text">MERCIA ROBOTICS</span>
            </a>

            <ul class="nav-links">
                <li><a href="/resources">Resources</a></li>
                <li><a href="/">Home</a></li>
                <li><a href="/learn">Learn</a></li>
                <li><a href="/news">News</a></li>
                <li><a href="https://instagram.com/merciarobotics" target="_blank" class="external-link">INSTAGRAM</a></li>
            </ul>
            <div class="mobile-menu-toggle">
                
                <div class="hamburger-line"></div>
                <div class="hamburger-line"></div>
                <div class="hamburger-line"></div>
            </div>

            <div class="mobile-nav">
                <a href="resources">Resources</a>
                <a href="">Home</a>
                <a href="learn">Learn</a>
                <a href="news">News</a>
                <a href="https://instagram.com/merciarobotics" target="_blank" class="external-link">INSTAGRAM</a>
            </div>
        </nav>
    </header>
</body>
